###Configuración base YAML: URL, usuario, Flyway, JPA, puerto del servidor
spring:
  application:
    name: sanmarcos
  profiles:
    active: local

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/sanmarcos_db?serverTimezone=America/Santiago&useSSL=false&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:sanmarcos_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: "${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,https://ncatalanv.github.io}"
  jwt:
    secret: "${JWT_SECRET:sanmarcos-dev-secret-change-me-32chars-min}"
    expiration: "${JWT_EXPIRATION:7200}"


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    operationsSorter: method