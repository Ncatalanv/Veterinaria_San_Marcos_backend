###Configuración base YAML: URL, usuario, Flyway, JPA, puerto del servidor
spring:
  application:
    name: sanmarcos

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/sanmarcos_db?serverTimezone=America/Santiago&useSSL=false&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:sanmarcos_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}