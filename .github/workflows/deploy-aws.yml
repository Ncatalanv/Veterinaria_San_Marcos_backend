name: CI/CD backend AWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: 1. Build y tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sanmarcos_db
          MYSQL_USER: sanmarcos_app
          MYSQL_PASSWORD: '1234'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_URL: 'jdbc:mysql://127.0.0.1:3306/sanmarcos_db?serverTimezone=America/Santiago&useSSL=false&allowPublicKeyRetrieval=true'
      DB_USERNAME: sanmarcos_app
      DB_PASSWORD: '1234'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tests
        run: bash ./mvnw -B test

      - name: Package
        run: bash ./mvnw -B -DskipTests package

      - name: Subir JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/sanmarcos-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

  deploy:
    name: 2. Despliegue en EC2
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar JAR
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: artifacts

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Subir JAR a S3
        run: aws s3 cp artifacts/sanmarcos-0.0.1-SNAPSHOT.jar s3://${{ vars.S3_BUCKET || 'veterinaria-san-marcos-frontend' }}/sanmarcos-0.0.1-SNAPSHOT.jar

      - name: Reiniciar servicio en EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new \
            aws/heartbeat.sh \
            aws/sanmarcos-heartbeat.service \
            aws/sanmarcos-heartbeat.timer \
            aws/cloudwatch-agent-config.json \
            ubuntu@"$EC2_HOST":/tmp/
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new ubuntu@"$EC2_HOST" <<'EOF'
            set -e
            sudo mkdir -p /var/log/sanmarcos
            if ! sudo grep -q '^LOG_FILE=' /etc/sanmarcos.env; then
              echo 'LOG_FILE=/var/log/sanmarcos/application.log' | sudo tee -a /etc/sanmarcos.env >/dev/null
            fi
            curl -fL -o /home/ubuntu/sanmarcos-0.0.1-SNAPSHOT.jar \
              "https://${{ vars.S3_BUCKET || 'veterinaria-san-marcos-frontend' }}.s3.amazonaws.com/sanmarcos-0.0.1-SNAPSHOT.jar"
            sudo systemctl restart sanmarcos
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1/actuator/health; then
                break
              fi
              sleep 3
            done
            sudo install -m 0755 /tmp/heartbeat.sh /usr/local/bin/sanmarcos-heartbeat.sh
            sudo install -m 0644 /tmp/sanmarcos-heartbeat.service /etc/systemd/system/sanmarcos-heartbeat.service
            sudo install -m 0644 /tmp/sanmarcos-heartbeat.timer /etc/systemd/system/sanmarcos-heartbeat.timer
            sudo mkdir -p /opt/aws/amazon-cloudwatch-agent/etc
            sudo install -m 0644 /tmp/cloudwatch-agent-config.json /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
            if ! command -v amazon-cloudwatch-agent-ctl >/dev/null 2>&1; then
              if ! wget -q -O /tmp/amazon-cloudwatch-agent.deb https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb; then
                echo "AVISO: no se pudo descargar CloudWatch Agent."
              elif ! sudo dpkg -i /tmp/amazon-cloudwatch-agent.deb; then
                echo "AVISO: no se pudo instalar CloudWatch Agent."
              fi
            fi
            if ! command -v amazon-cloudwatch-agent-ctl >/dev/null 2>&1; then
              echo "AVISO: CloudWatch Agent no está disponible."
            else
              TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" || true)
              IAM_ROLE=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" "http://169.254.169.254/latest/meta-data/iam/security-credentials/" || true)
              if [ -z "$IAM_ROLE" ]; then
                echo "AVISO: la EC2 no tiene rol IAM; CloudWatch no podra publicar logs."
              else
                echo "Rol IAM de EC2: $IAM_ROLE"
              fi
              if ! sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
                -a fetch-config -m ec2 -s \
                -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json; then
                echo "AVISO: CloudWatch Agent no pudo iniciar; revisar permisos IAM."
              fi
            fi
            sudo systemctl daemon-reload
            sudo systemctl enable --now sanmarcos-heartbeat.timer
            if ! curl -fsS http://127.0.0.1/actuator/health; then
              sudo journalctl -u sanmarcos -n 80 --no-pager
              exit 1
            fi
            sudo systemctl status sanmarcos --no-pager
            sudo systemctl status amazon-cloudwatch-agent --no-pager || true
            sudo systemctl status sanmarcos-heartbeat.timer --no-pager
          EOF
